[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanmay Tripathi", email = "tanmaytripathi43@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=4.2.1",
    "celery>=5.6.3",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "google-genai>=0.2.2",
    "openai>=1.50.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.1",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
