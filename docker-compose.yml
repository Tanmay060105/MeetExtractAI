services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:16-alpine

    container_name: meetextract-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetextract}
      POSTGRES_USER: ${POSTGRES_USER:-meetextract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-meetextract} -d ${POSTGRES_DB:-meetextract}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - meetextract-network


  # ==========================================================
  # Redis
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: meetextract-redis

    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - yes

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - meetextract-network


  # ==========================================================
  # Backend
  # ==========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: meetextract-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-meetextract}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-meetextract}
      REDIS_URL: redis://redis:6379/0

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "uv",
        "run",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

    networks:
      - meetextract-network


  # ==========================================================
  # Background Worker
  # ==========================================================

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: meetextract-worker

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-meetextract}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-meetextract}
      REDIS_URL: redis://redis:6379/0

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "--loglevel=info"
      ]

    networks:
      - meetextract-network


  # ==========================================================
  # Frontend
  # ==========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: meetextract-frontend

    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    depends_on:
      - backend

    command:
      [
        "npm",
        "run",
        "dev"
      ]

    networks:
      - meetextract-network


# ==========================================================
# Persistent Volumes
# ==========================================================

volumes:

  postgres_data:
    name: meetextract-postgres-data

  redis_data:
    name: meetextract-redis-data


# ==========================================================
# Network
# ==========================================================

networks:

  meetextract-network:
    name: meetextract-network
    driver: bridge
